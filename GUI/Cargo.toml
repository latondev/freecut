[package]
name = "freecut-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "FreeCut native desktop shell"

[dependencies]
slint = { version = "1.17", features = ["backend-winit", "renderer-software", "accessibility"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
